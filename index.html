<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener - jaimin.web</title>
    <link rel="icon" href="images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        * { -webkit-tap-highlight-color: transparent !important; }
            button:focus, a:focus, input:focus { outline: none !important; }
    </style>
</head>
<body>

    <!-- Redirecting Screen -->
    <div id="redirect-overlay" class="hidden">
        <div id="redirect-spinner" class="redirect-spinner animate-spin"></div>
        <h2 id="redirect-msg">Fetching your link...</h2>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="main-app">
        <!-- Header -->
        <header>
            <div class="header-container">
                <div class="header-inner">
                    <a href="#home" class="brand-logo">
                        <svg class="brand-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        <span class="brand-text">ShortLink</span>
                    </a>
                    <nav class="desktop-nav">
                        <a href="#home" class="nav-link">Home</a>
                    </nav>
                    <div class="mobile-menu-wrapper">
                        <button id="menu-btn" aria-label="Open Menu">
                            <svg class="w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Navigation Drawer (Mobile) -->
        <div id="drawer">
            <div class="drawer-header">
                <span class="drawer-title">
                    <svg class="w-6 hero-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    Menu
                </span>
                <button id="close-drawer" aria-label="Close Menu">
                    <svg class="w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <nav class="drawer-nav">
                <a href="#home" class="mobile-link">
                    <svg class="w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Home
                </a>
            </nav>
        </div>
        <div id="drawer-overlay" class="hidden"></div>

        <!-- MAIN HOME SECTION -->
        <main id="home">
            <div class="hero-section reveal active">
                <h1 class="hero-title">
                    Shorten Your <span class="hero-accent">Links</span>
                </h1>
                <p class="hero-subtitle">
                    Create clean, concise URLs in seconds. Paste your long link below and make it easily shareable.
                </p>
            </div>

            <!-- Input Form -->
            <form id="shorten-form" class="reveal delay-100 active">
                <!-- SECURITY: Honeypot field -->
                <input type="text" id="website_url" name="website_url" class="visually-hidden" autocomplete="off" tabindex="-1">
                
                <div class="input-icon-wrapper">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                </div>
                <input type="url" id="long-url" required placeholder="Paste your long URL here..." maxlength="2048">
                <button type="submit" id="submit-btn">
                    <span id="btn-text">Shorten</span>
                    <svg id="loading-spinner" class="animate-spin hidden w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </form>

            <div id="error-message" class="hidden"></div>

            <!-- Result Container -->
            <div id="result-container" class="hidden">
                <p class="result-label">Your Short Link</p>
                <div class="result-box">
                    <a href="#" id="short-url-link" target="_blank" rel="noopener noreferrer"></a>
                    <button id="copy-btn">
                        <svg class="w-5" id="copy-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span id="copy-text">Copy</span>
                    </button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p class="footer-text">
                Developed by <span class="footer-author">jaimin.web</span>
            </p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
